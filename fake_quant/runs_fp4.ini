; # FP4 weight quantization scan — mirrors the v51_g16_ugdeq progression
; # in runs_v5.ini, but with FP4 weights (level set {0, +/-1, +/-2, +/-3,
; # +/-4, +/-6, +/-8, +/-12} mapped via scale = amax/12) instead of int4.
; # Each row builds on the previous: weights-only -> + static act ->
; # + pwl -> + smq16 -> + intgemm -> + quant_out ex.
; # All runs G=16, ugdeq + no_r4, sym weights (FP4 is sym-only).
; # ============================================================

; ; # --- FP4 ALL layers, G=16, ugdeq ---
; v51_g16_ugdeq_fp4_wonly:                              quarot -m 1b -w 4 -a 16 -k 16 -v 16 -G 16 --no_r4 --ugd_eq --sim_version 51 --realint --fp4 all
; v51_g16_ugdeq_fp4_act:                                quarot -m 1b --static-act -w 4 -a 8 -k 8 -v 8 -G 16 --kv_ex 8 --down_bits 16 --no_r4 --ugd_eq --sim_version 51 --hw_accurate --realint --fp4 all
; v51_g16_ugdeq_fp4_act_pwl:                            quarot -m 1b --static-act -w 4 -a 8 -k 8 -v 8 -G 16 --kv_ex 8 --down_bits 16 --no_r4 --ugd_eq --sim_version 51 --hw_accurate --realint --pwl_act --fp4 all
; v51_g16_ugdeq_fp4_act_pwl_smq16:                      quarot -m 1b --static-act -w 4 -a 8 -k 8 -v 8 -G 16 --kv_ex 8 --down_bits 16 --no_r4 --ugd_eq --sim_version 51 --hw_accurate --realint --pwl_act --smq 16 --fp4 all
; v51_g16_ugdeq_fp4_act_pwl_smq16_intgemm:              quarot -m 1b --static-act -w 4 -a 8 -k 8 -v 8 -G 16 --kv_ex 8 --down_bits 16 --no_r4 --ugd_eq --sim_version 51 --hw_accurate --realint --pwl_act --smq 16 --int_gemm --acc_block_k 16 --acc_bits 16 --acc_wrap --fp4 all
; v51_g16_ugdeq_fp4_act_pwl_smq16_intgemm_qex:          quarot -m 1b --static-act -w 4 -a 8 -k 8 -v 8 -G 16 --kv_ex 8 --down_bits 16 --no_r4 --ugd_eq --sim_version 51 --hw_accurate --realint --pwl_act --smq 16 --int_gemm --acc_block_k 16 --acc_bits 16 --acc_wrap --quant_out ex --fp4 all

